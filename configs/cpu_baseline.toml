[experiment] # 实验元信息
name = "cpu-baseline-7840h-wsl"
seed = 20260825

[workload] # 负载参数
name = "cpu-operator-suite-v1"
batch_size = 1

[hardware] # 硬件信息
memory_type = "5600-MT/s-user-reported"
near_memory_enabled = false

[output] # 输出路径
directory = "outputs"

[cpu_benchmark] # CPU 基准跑分核心配置
dataset = "data/sample/cpu_operator_suite.toml"
warmup_iterations = 3 # 让 CPU 缓存预热
measured_iterations = 11
target_sample_ms = 20
operators = [ # 操作算子列表
  "copy", # 内存拷贝
  "add", # 逐元素加法 a + b
  "multiply", # 逐元素乘法 a * b
  "relu", # ReLU激活函数 max(x, 0)
  "sum", # 张量求和 reduce‑sum
  "gather", # 索引收集算子（稀疏内存访问，随机读）
  "transpose_copy", # 矩阵转置+拷贝，典型的缓存不友好操作
  "threshold_count", # 阈值计数，遍历统计大于阈值元素数量
  "filter_compact", # 过滤压缩：筛选符合条件元素，紧凑输出
  "histogram", # 直方图统计
  "crc32", # CRC32校验，哈希计算
  "matmul", # 矩阵乘法（算力重负载）
]
