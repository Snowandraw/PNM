[experiment]
name = "cpu-baseline-core-ultra-9-285k-pcore-single"
seed = 20260825

[workload]
name = "cpu-operator-suite-v1"
batch_size = 1

[hardware]
platform = "bare-metal-linux"
cpu_model = "Intel Core Ultra 9 285K"
cpu_class = "P-core"
numa_node = 0
memory_type = "system-dram-256GiB-speed-unrecorded"
near_memory_enabled = false

[execution]
profile = "pcore-single-cpu2"
cpu_affinity = [2]
thread_count = 1

[output]
directory = "outputs/server-285k"

[cpu_benchmark]
dataset = "data/sample/cpu_operator_suite.toml"
warmup_iterations = 5
measured_iterations = 15
target_sample_ms = 50
operators = [
  "copy",
  "add",
  "multiply",
  "relu",
  "sum",
  "gather",
  "transpose_copy",
  "threshold_count",
  "filter_compact",
  "histogram",
  "crc32",
  "matmul",
]
