<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BlueField-3 DPU 概念结构图</title>
  <desc id="desc">主机经 PCIe 连接 BlueField-3 SoC。SoC 集成 Arm 核、ConnectX-7 网络前端、DPA、PCIe switch 和 DDR5 控制器；网络经两个 QSFP112 端口连接，板载 DDR5 和带外 BMC 为辅助组件。</desc>
  <style>
    .title { font: 700 36px Arial, "Microsoft YaHei", sans-serif; fill: #10233f; }
    .subtitle { font: 18px Arial, "Microsoft YaHei", sans-serif; fill: #536579; }
    .section { font: 700 24px Arial, "Microsoft YaHei", sans-serif; fill: #10233f; }
    .label { font: 600 21px Arial, "Microsoft YaHei", sans-serif; fill: #10233f; }
    .text { font: 17px Arial, "Microsoft YaHei", sans-serif; fill: #31465e; }
    .small { font: 15px Arial, "Microsoft YaHei", sans-serif; fill: #536579; }
    .host { fill: #eef5ff; stroke: #4a83d8; stroke-width: 2; }
    .soc { fill: #f2f7ff; stroke: #2d6ccc; stroke-width: 3; }
    .module { fill: #ffffff; stroke: #93afd3; stroke-width: 1.5; }
    .network { fill: #e8f8f3; stroke: #2c9975; stroke-width: 2; }
    .memory { fill: #fff5e5; stroke: #d68c2e; stroke-width: 2; }
    .manage { fill: #f5efff; stroke: #8964cc; stroke-width: 2; }
    .note { fill: #f7f9fc; stroke: #c7d3e0; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #37536f; stroke-width: 2.5; marker-end: url(#arrowhead); }
    .dashed { fill: none; stroke: #8296aa; stroke-width: 2; stroke-dasharray: 8 8; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#37536f"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="70" y="72" class="title">NVIDIA BlueField-3 DPU：概念结构图</text>
  <text x="70" y="105" class="subtitle">用于架构理解，不表示某一 OPN 的真实 PCB 布局或芯片位置</text>

  <rect x="70" y="315" width="290" height="250" rx="18" class="host"/>
  <text x="215" y="365" text-anchor="middle" class="section">主机（x86 或 Arm）</text>
  <rect x="102" y="400" width="226" height="58" rx="10" class="module"/>
  <text x="215" y="436" text-anchor="middle" class="label">Host OS / 应用</text>
  <rect x="102" y="478" width="226" height="58" rx="10" class="module"/>
  <text x="215" y="514" text-anchor="middle" class="label">mlx5 / DOCA-Host</text>

  <rect x="505" y="165" width="650" height="535" rx="24" class="soc"/>
  <text x="830" y="215" text-anchor="middle" class="section">BlueField-3 SoC（单芯片）</text>
  <text x="830" y="246" text-anchor="middle" class="small">集成 Arm 计算、ConnectX-7 网络前端与 PCIe switch</text>

  <rect x="550" y="280" width="260" height="110" rx="14" class="module"/>
  <text x="680" y="322" text-anchor="middle" class="label">Arm A78 核簇</text>
  <text x="680" y="354" text-anchor="middle" class="text">DPU OS / 控制面程序</text>
  <text x="680" y="378" text-anchor="middle" class="small">具体核数取决于 SKU</text>

  <rect x="850" y="280" width="260" height="110" rx="14" class="module"/>
  <text x="980" y="322" text-anchor="middle" class="label">DPA</text>
  <text x="980" y="354" text-anchor="middle" class="text">可编程数据路径加速器</text>
  <text x="980" y="378" text-anchor="middle" class="small">面向网络与 I/O 工作负载</text>

  <rect x="550" y="430" width="560" height="105" rx="14" class="network"/>
  <text x="830" y="472" text-anchor="middle" class="label">ConnectX-7 网络前端（一个集成模块）</text>
  <text x="830" y="504" text-anchor="middle" class="text">RDMA / RoCE / eSwitch / 网络与安全卸载</text>

  <rect x="550" y="575" width="260" height="78" rx="14" class="module"/>
  <text x="680" y="609" text-anchor="middle" class="label">PCIe switch</text>
  <text x="680" y="636" text-anchor="middle" class="small">Endpoint / Root Complex</text>

  <rect x="850" y="575" width="260" height="78" rx="14" class="memory"/>
  <text x="980" y="609" text-anchor="middle" class="label">DDR5 控制器</text>
  <text x="980" y="636" text-anchor="middle" class="small">双通道 / ECC（依 SKU）</text>

  <rect x="1240" y="270" width="290" height="135" rx="18" class="network"/>
  <text x="1385" y="315" text-anchor="middle" class="section">2 × QSFP112 端口</text>
  <text x="1385" y="350" text-anchor="middle" class="text">Ethernet 或 InfiniBand</text>
  <text x="1385" y="379" text-anchor="middle" class="small">最高速率与端口拆分依 OPN / 配置</text>

  <rect x="1240" y="495" width="290" height="115" rx="18" class="memory"/>
  <text x="1385" y="538" text-anchor="middle" class="section">板载 DDR5 ECC</text>
  <text x="1385" y="571" text-anchor="middle" class="text">DPU 的专用内存</text>
  <text x="1385" y="596" text-anchor="middle" class="small">容量和颗粒位置因卡型而异</text>

  <rect x="1240" y="665" width="290" height="80" rx="18" class="manage"/>
  <text x="1385" y="700" text-anchor="middle" class="label">集成 BMC / OOB 管理</text>
  <text x="1385" y="728" text-anchor="middle" class="small">型号支持情况以 OPN 为准</text>

  <rect x="68" y="700" width="292" height="100" rx="18" class="note"/>
  <text x="214" y="740" text-anchor="middle" class="label">PCIe Gen5 x16</text>
  <text x="214" y="770" text-anchor="middle" class="small">主机与 DPU 的 PCIe 数据路径</text>

  <path d="M360 440 H505" class="arrow"/>
  <text x="430" y="420" text-anchor="middle" class="small">PCIe 数据路径</text>
  <path d="M680 575 V535" class="dashed"/>
  <path d="M980 575 V535" class="dashed"/>
  <path d="M1110 482 H1240" class="arrow"/>
  <path d="M1110 614 H1240" class="arrow"/>
  <path d="M360 750 H430 V614 H550" class="arrow"/>
  <path d="M1385 665 V610" class="dashed"/>

  <rect x="70" y="830" width="1460" height="38" rx="10" class="note"/>
  <text x="800" y="855" text-anchor="middle" class="small">关键校正：QSFP112 是两个物理网络端口，不是两颗独立的 ConnectX-7 控制器；“400G”是特定 SKU/链路的网络速率，不是单独的板上部件。</text>
</svg>
