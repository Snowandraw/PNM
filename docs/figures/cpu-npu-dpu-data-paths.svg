<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">CPU、NPU、DPU、GPU 与 SSD 的控制和数据路径</title>
  <desc id="desc">一台服务器中，CPU 通过主机 DDR 和 PCIe 根复合体管理 NPU、DPU 和 NVMe SSD。DPU 包含 Arm、DPA、eSwitch、板载 DDR 和网络端口。绿色实线表示常规数据路径，蓝色实线表示控制路径，紫色虚线表示需额外支持的直接零拷贝路径。</desc>
  <style>
    .title { font: 700 42px Arial, "Microsoft YaHei", sans-serif; fill: #10233f; }
    .subtitle { font: 19px Arial, "Microsoft YaHei", sans-serif; fill: #52677f; }
    .group { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #1c3552; }
    .label { font: 700 23px Arial, "Microsoft YaHei", sans-serif; fill: #132e4a; }
    .text { font: 18px Arial, "Microsoft YaHei", sans-serif; fill: #314a66; }
    .small { font: 16px Arial, "Microsoft YaHei", sans-serif; fill: #52677f; }
    .tiny { font: 14px Arial, "Microsoft YaHei", sans-serif; fill: #52677f; }
    .server { fill: #fbfdff; stroke: #b4c8dd; stroke-width: 2.5; }
    .cpu { fill: #edf5ff; stroke: #3378c7; stroke-width: 2.5; }
    .memory { fill: #fff6df; stroke: #d7902c; stroke-width: 2.5; }
    .fabric { fill: #f1f4f8; stroke: #75899e; stroke-width: 2.5; }
    .npu { fill: #f4edff; stroke: #805ac5; stroke-width: 2.5; }
    .gpu { fill: #f5f1fb; stroke: #9378bc; stroke-width: 2.5; stroke-dasharray: 9 6; }
    .dpu { fill: #eefaf6; stroke: #2c9975; stroke-width: 3; }
    .dpu-module { fill: #ffffff; stroke: #77bda7; stroke-width: 1.7; }
    .storage { fill: #fff2e9; stroke: #d56d32; stroke-width: 2.5; }
    .network { fill: #eaf8f4; stroke: #25956d; stroke-width: 2.5; }
    .note { fill: #f7f9fc; stroke: #c4d1df; stroke-width: 1.5; }
    .control { fill: none; stroke: #2f78c4; stroke-width: 3; marker-end: url(#arrow-control); }
    .data { fill: none; stroke: #1e9b70; stroke-width: 5; marker-end: url(#arrow-data); }
    .data-bidir { fill: none; stroke: #1e9b70; stroke-width: 5; marker-start: url(#arrow-data); marker-end: url(#arrow-data); }
    .internal { fill: none; stroke: #34647b; stroke-width: 2.5; marker-end: url(#arrow-internal); }
    .optional { fill: none; stroke: #805ac5; stroke-width: 3.5; stroke-dasharray: 13 10; marker-end: url(#arrow-optional); }
    .storage-path { fill: none; stroke: #d56d32; stroke-width: 4; marker-end: url(#arrow-storage); }
    .storage-bidir { fill: none; stroke: #d56d32; stroke-width: 4; marker-start: url(#arrow-storage); marker-end: url(#arrow-storage); }
  </style>
  <defs>
    <marker id="arrow-control" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f78c4"/></marker>
    <marker id="arrow-data" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1e9b70"/></marker>
    <marker id="arrow-internal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34647b"/></marker>
    <marker id="arrow-optional" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#805ac5"/></marker>
    <marker id="arrow-storage" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d56d32"/></marker>
  </defs>

  <rect width="2400" height="1500" fill="#ffffff"/>
  <text x="70" y="75" class="title">CPU、NPU、DPU、GPU 与 SSD：控制面和数据链路</text>
  <text x="70" y="110" class="subtitle">参考拓扑：一台带离散 PCIe NPU 与 BlueField-3 DPU 的服务器。实线是常规路径；虚线是需要平台、设备与驱动共同支持的可选零拷贝路径。</text>

  <rect x="45" y="160" width="2150" height="1035" rx="26" class="server"/>
  <text x="82" y="208" class="group">服务器内部（主机侧）</text>

  <!-- CPU and host memory -->
  <rect x="105" y="270" width="370" height="185" rx="18" class="cpu"/>
  <text x="290" y="320" text-anchor="middle" class="label">CPU</text>
  <text x="290" y="355" text-anchor="middle" class="text">应用逻辑、调度、驱动</text>
  <text x="290" y="385" text-anchor="middle" class="text">控制面与异常处理</text>
  <text x="290" y="420" text-anchor="middle" class="small">CPU 不等于所有数据都必须经过它复制</text>

  <rect x="105" y="555" width="370" height="170" rx="18" class="memory"/>
  <text x="290" y="607" text-anchor="middle" class="label">主机 DDR 内存</text>
  <text x="290" y="641" text-anchor="middle" class="text">CPU 可直接 load/store</text>
  <text x="290" y="672" text-anchor="middle" class="text">DMA 的常见落点 / bounce buffer</text>
  <text x="290" y="702" text-anchor="middle" class="small">与 DPU 板载 DDR 是两套不同内存</text>

  <rect x="570" y="410" width="305" height="290" rx="18" class="fabric"/>
  <text x="722" y="460" text-anchor="middle" class="label">CPU Root Complex</text>
  <text x="722" y="493" text-anchor="middle" class="text">PCIe Gen5 根复合体</text>
  <text x="722" y="525" text-anchor="middle" class="small">可选：PCIe switch</text>
  <line x1="615" y1="558" x2="830" y2="558" stroke="#a5b3c1" stroke-width="1.5"/>
  <text x="722" y="595" text-anchor="middle" class="text">为 NPU / DPU / SSD 提供</text>
  <text x="722" y="625" text-anchor="middle" class="text">PCIe 枚举、MMIO 与 DMA 路径</text>
  <text x="722" y="660" text-anchor="middle" class="small">并非所有设备都能彼此 P2P</text>
  <text x="722" y="684" text-anchor="middle" class="tiny">离散 NPU、DPU 与 SSD 是该 PCIe 树下的并列端点</text>

  <!-- NPU -->
  <rect x="995" y="255" width="410" height="265" rx="18" class="npu"/>
  <text x="1200" y="308" text-anchor="middle" class="label">NPU（离散 AI 加速器）</text>
  <text x="1200" y="341" text-anchor="middle" class="text">执行张量 / 神经网络算子</text>
  <text x="1200" y="372" text-anchor="middle" class="small">图中假定通过 PCIe 连接；不同厂商实现不同</text>
  <rect x="1030" y="402" width="340" height="76" rx="12" class="memory"/>
  <text x="1200" y="433" text-anchor="middle" class="label">NPU 本地内存</text>
  <text x="1200" y="461" text-anchor="middle" class="small">HBM / DDR / 共享内存，取决于设备</text>

  <!-- Optional GPU comparison -->
  <rect x="995" y="755" width="410" height="165" rx="18" class="gpu"/>
  <text x="1200" y="807" text-anchor="middle" class="label">GPU（可选对照）</text>
  <text x="1200" y="840" text-anchor="middle" class="text">与离散 NPU 的 PCIe 拓扑相似</text>
  <text x="1200" y="870" text-anchor="middle" class="small">GPU 的直接 RDMA 生态更成熟；不代表通用 NPU 自动支持</text>

  <!-- SSD -->
  <rect x="105" y="835" width="370" height="175" rx="18" class="storage"/>
  <text x="290" y="886" text-anchor="middle" class="label">NVMe SSD</text>
  <text x="290" y="920" text-anchor="middle" class="text">模型、数据集、检查点</text>
  <text x="290" y="951" text-anchor="middle" class="text">NVMe 命令经 PCIe 提交，数据通过 DMA 传输</text>
  <text x="290" y="980" text-anchor="middle" class="small">默认由主机 CPU / 驱动管理</text>

  <!-- DPU -->
  <rect x="1500" y="245" width="620" height="765" rx="22" class="dpu"/>
  <text x="1810" y="295" text-anchor="middle" class="group">BlueField-3 DPU（基础设施处理器）</text>
  <rect x="1535" y="335" width="210" height="118" rx="14" class="dpu-module"/>
  <text x="1640" y="378" text-anchor="middle" class="label">PCIe 接口</text>
  <text x="1640" y="410" text-anchor="middle" class="small">主机 Endpoint</text>
  <text x="1640" y="435" text-anchor="middle" class="small">或专用拓扑中的 Root Complex</text>

  <rect x="1780" y="335" width="300" height="118" rx="14" class="dpu-module"/>
  <text x="1930" y="378" text-anchor="middle" class="label">Arm 核簇（控制面）</text>
  <text x="1930" y="410" text-anchor="middle" class="small">DPU OS、DOCA 服务、策略</text>
  <text x="1930" y="435" text-anchor="middle" class="small">不是 AI 模型算子的主要执行单元</text>

  <rect x="1535" y="505" width="260" height="145" rx="14" class="dpu-module"/>
  <text x="1665" y="550" text-anchor="middle" class="label">DPA</text>
  <text x="1665" y="582" text-anchor="middle" class="text">可编程 I/O / 报文数据路径</text>
  <text x="1665" y="614" text-anchor="middle" class="small">适合通信、协议和轻量数据处理</text>

  <rect x="1830" y="505" width="250" height="145" rx="14" class="dpu-module"/>
  <text x="1955" y="550" text-anchor="middle" class="label">DPU 板载 DDR5</text>
  <text x="1955" y="582" text-anchor="middle" class="text">供 Arm / DPA 使用</text>
  <text x="1955" y="614" text-anchor="middle" class="small">不会自动成为 NPU 的可见内存</text>

  <rect x="1535" y="710" width="545" height="120" rx="14" class="network"/>
  <text x="1807" y="755" text-anchor="middle" class="label">ConnectX-7 网络前端、eSwitch 与硬件卸载</text>
  <text x="1807" y="788" text-anchor="middle" class="text">RDMA / RoCE / 加解密 / 隧道封装 / 虚拟交换</text>

  <rect x="1535" y="875" width="545" height="88" rx="14" class="network"/>
  <text x="1807" y="911" text-anchor="middle" class="label">2 × QSFP112 网络端口</text>
  <text x="1807" y="941" text-anchor="middle" class="small">Ethernet 或 InfiniBand；速率由实际 OPN 与配置决定</text>

  <!-- Network fabric -->
  <rect x="1690" y="1075" width="505" height="120" rx="18" class="network"/>
  <text x="1942" y="1122" text-anchor="middle" class="label">交换网络 / 远端节点</text>
  <text x="1942" y="1156" text-anchor="middle" class="text">Ethernet / InfiniBand · 远端 CPU、DPU、存储或加速器</text>

  <!-- Normal control paths -->
  <path d="M475 360 H570" class="control"/>
  <text x="522" y="338" text-anchor="middle" class="tiny">枚举 / 配置</text>
  <path d="M875 444 H995" class="control"/>
  <text x="935" y="421" text-anchor="middle" class="tiny">驱动、任务提交</text>
  <path d="M875 685 H1455 V395 H1535" class="control"/>
  <text x="1180" y="666" text-anchor="middle" class="tiny">DOCA、控制与状态（同一 PCIe 链路上的控制面）</text>
  <path d="M570 650 H475" class="control"/>
  <path d="M570 890 H475" class="control"/>

  <!-- Normal data paths -->
  <path d="M290 455 V555" class="data"/>
  <text x="340" y="520" class="tiny">load/store</text>
  <path d="M475 640 H570" class="data-bidir"/>
  <path d="M875 640 H930 V480 H995" class="data-bidir"/>
  <text x="940" y="535" text-anchor="middle" class="tiny">主机 DDR → 加速器内存</text>
  <path d="M475 920 H540 V670 H570" class="storage-bidir"/>
  <text x="486" y="773" class="tiny">NVMe DMA</text>
  <path d="M875 620 H1465 V393 H1535" class="data-bidir"/>
  <text x="1190" y="603" text-anchor="middle" class="tiny">主机 DDR ↔ PCIe DMA ↔ DPU host function</text>
  <path d="M1745 394 H1780" class="internal"/>
  <path d="M1930 453 V505" class="internal"/>
  <path d="M1640 453 V505" class="internal"/>
  <path d="M1665 650 V710" class="internal"/>
  <path d="M1955 650 V710" class="internal"/>
  <path d="M1807 830 V875" class="data"/>
  <path d="M1807 963 V1075" class="data"/>
  <path d="M1640 453 H1515 V770 H1535" class="data-bidir"/>
  <text x="1495" y="705" text-anchor="end" class="tiny">eSwitch fast path ↔ host PCIe</text>
  <path d="M2080 394 H2100 V770 H2080" class="control"/>
  <text x="2110" y="595" class="tiny"><tspan x="2110" dy="0">Arm / DOCA 下发</tspan><tspan x="2110" dy="19">策略与 flow 规则</tspan></text>

  <!-- Conditional direct paths -->
  <path d="M1405 452 H1450 V770 H1535" class="optional"/>
  <text x="1426" y="610" text-anchor="middle" class="tiny">可选：Accelerator Direct RDMA / P2P</text>
  <text x="1426" y="630" text-anchor="middle" class="tiny">须同 PCIe Root Complex 等条件</text>
  <path d="M475 955 H1260 V1050 H1460 V453 H1535" class="optional"/>
  <text x="995" y="1052" text-anchor="middle" class="tiny">可选：DPU 存储卸载 / SNAP / 专用 P2P 拓扑；不是普通服务器的默认连线</text>

  <!-- Legend and usage notes -->
  <rect x="70" y="1240" width="2260" height="195" rx="20" class="note"/>
  <text x="110" y="1285" class="label">如何读这张图</text>
  <line x1="112" y1="1325" x2="220" y2="1325" class="control"/>
  <text x="240" y="1332" class="text">蓝色：CPU 发起配置、驱动调用和任务提交（控制面）</text>
  <line x1="875" y1="1325" x2="983" y2="1325" class="data"/>
  <text x="1005" y="1332" class="text">绿色：默认数据路径 / DMA</text>
  <line x1="1450" y1="1325" x2="1558" y2="1325" class="optional"/>
  <text x="1580" y="1332" class="text">紫色虚线：可选零拷贝，必须先验证支持性</text>
  <text x="110" y="1385" class="text">默认远端输入：网络 → DPU eSwitch / PCIe DMA → 主机 DDR → NPU 本地内存 → NPU 计算。DPU 板载 DDR 用于 DPU 自身，不是此路径的必经中转。</text>
  <text x="110" y="1418" class="small">若你的 NPU 集成在 CPU/SoC 内，而非 PCIe 卡：将 NPU 与 CPU Root Complex 的连线替换为片上互连 / 共享内存；DPU、SSD、网络侧关系保持不变。</text>
</svg>
