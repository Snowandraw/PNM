[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnm-research"
version = "0.1.0"
description = "Reproducible research scaffold for processing-near-memory experiments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Snow" }]
dependencies = []

[project.optional-dependencies]
cpu = [
  "numpy>=1.26,<3",
]
dev = [
  "numpy>=1.26,<3",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pnm = "pnm.cli:main"
pnm-cpu-benchmark = "pnm.benchmarks.cpu:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
